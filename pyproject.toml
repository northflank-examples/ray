[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "ray-northflank"
version = "0.1.0"
description = "Ray autoscaler provider with one Northflank service per worker"
requires-python = ">=3.11,<3.12"
dependencies = [
    "ray[default]==2.59.0",
    "northflank==2.0.0",
    "httpx>=0.27,<1",
    "PyYAML>=6.0.2,<7",
    "redis>=5.2.1,<6",
]

[project.scripts]
ray-northflank = "northflank_ray.cli:main"
ray-northflank-start = "northflank_ray.runtime:main"

[tool.setuptools.packages.find]
where = ["src"]
